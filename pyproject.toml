[project]
name = "dsc26-ai-w03"
version = "0.1.0"
description = "DSC Summer Internship 2026, AI track, W3 task: Tawseel honest baseline"
requires-python = ">=3.12,<3.13"
# Provided by DSC. Do not change the dependencies: the grader uses exactly these versions
# and nothing else is installed there.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
timeout = 120
